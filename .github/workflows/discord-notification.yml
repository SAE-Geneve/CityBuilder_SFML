name: Discord Notification

on:
  push:
    branches: [ main, master, develop, 925 ] # Modifiez selon vos branches

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Send Discord notification
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        # Préparer les données du commit
        COMMIT_MESSAGE=$(echo '${{ github.event.head_commit.message }}' | head -n1)
        COMMIT_URL="${{ github.event.head_commit.url }}"
        AUTHOR_NAME="${{ github.event.head_commit.author.name }}"
        REPO_NAME="${{ github.repository }}"
        BRANCH_NAME="${{ github.ref_name }}"
        
        # Créer le payload JSON pour Discord
        cat << EOF > discord_payload.json
        {
          "content": "<@&1412376932271657000> Nouveau push... Mettez vous à jour.",
          "embeds": [
            {
              "author": {
                "name": "Repository Update",
                "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
              },
              "title": "🚀 $REPO_NAME",
              "description": "**Branche:** \`$BRANCH_NAME\`\n**Commit:** $COMMIT_MESSAGE",
              "url": "$COMMIT_URL",
              "color": 3447003,
              "fields": [
                {
                  "name": "Auteur",
                  "value": "$AUTHOR_NAME",
                  "inline": true
                },
                {
                  "name": "Repository",
                  "value": "[$REPO_NAME](https://github.com/$REPO_NAME)",
                  "inline": true
                }
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }
          ],
          "allowed_mentions": {
            "roles": ["1412376932271657000"]
          }
        }
        EOF
        
        # Envoyer la notification à Discord (dans le thread)
        curl -H "Content-Type: application/json" \
             -d @discord_payload.json \
             "$DISCORD_WEBHOOK_URL?thread_id=1518557303283122296"